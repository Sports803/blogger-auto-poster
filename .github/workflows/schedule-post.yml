name: Auto-Poster (Telegram)

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:         # manual trigger

concurrency:
  group: blogger-feed-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore posted-item state
        uses: actions/cache/restore@v4
        with:
          path: posted_items.json
          key: state-cache-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            state-cache-${{ github.repository }}-
      - name: Run poster
        env:
          BLOGGER_RSS: ${{ secrets.BLOGGER_RSS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_ITEMS_PER_RUN: '50'
        run: python poster.py
      - name: Save posted-item state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: posted_items.json
          key: state-cache-${{ github.repository }}-${{ github.run_id }}
